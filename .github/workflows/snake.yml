name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Varn1t
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # stats card counted with the owner's token, so private-repo PRs count; keeps the last card if the token is missing
      # (dist/ is root-owned after snk, hence /tmp and sudo cp)
      - run: |
          curl -sfL https://raw.githubusercontent.com/Varn1t/Varn1t/output/github-stats.svg -o /tmp/github-stats.svg || true
          if [ -n "$STATS_TOKEN" ]; then python .github/scripts/stats_card.py /tmp/github-stats.svg; fi
          if [ -f /tmp/github-stats.svg ]; then sudo cp /tmp/github-stats.svg dist/; fi

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
